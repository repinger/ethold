version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*net/http.Response).Body.Close
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-QF*"
  exclusions:
    rules:
      - path: '.*_test\.go'
        linters:
          - errcheck
